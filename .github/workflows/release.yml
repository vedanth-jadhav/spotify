name: Release macOS DMG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.16.0
      - run: npm ci

      - name: Build native release binary
        run: npx --no-install native build --yes

      - name: Package signed macOS app
        run: npx --no-install native package --target macos --signing adhoc

      - name: Create and verify DMG
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find zig-out -type d -name '*.app' -print -quit)"
          test -n "$APP"
          codesign --verify --deep --strict "$APP"

          rm -rf dist dmg-root
          mkdir -p dist dmg-root
          ditto "$APP" dmg-root/Spotify.app
          ln -s /Applications dmg-root/Applications

          DMG="dist/Spotify-0.1.0-macos-arm64.dmg"
          hdiutil create -volname "Spotify" -srcfolder dmg-root -ov -format UDZO "$DMG"
          hdiutil verify "$DMG"
          shasum -a 256 "$DMG" | tee "$DMG.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.1.0"
          DMG="dist/Spotify-0.1.0-macos-arm64.dmg"
          CHECKSUM="$DMG.sha256"
          cat > /tmp/release-notes.md <<'NOTES'
          Native Spotify-style desktop music client backed by Octave Streaming.

          This release includes the merged Spotify desktop UI/UX parity overhaul, Octave-backed search and playback, persistent library state, playlists, lyrics, artist navigation, queue, quality controls, and the native macOS release package.

          This build targets Apple-silicon Macs and is ad-hoc signed. Because it is not notarized with an Apple Developer ID, macOS may show the normal unidentified-developer/Gatekeeper warning for downloaded builds. Control-click the app and choose Open on first launch if required.
          NOTES

          # Recreate the release/tag so the published v0.1.0 metadata and tag always
          # point at the exact commit that produced the DMG instead of silently
          # clobbering assets on an older tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          gh release create "$TAG" "$DMG" "$CHECKSUM" \
            --target "$GITHUB_SHA" \
            --title "Spotify 0.1.0" \
            --notes-file /tmp/release-notes.md
