name: Commit queue ScriptC fix

on:
  push:
    branches: ["feat/native-octave-client"]
    paths: [".github/workflows/final-core-fix.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-octave-client
      - name: Literalize queue handles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core.ts')
          s = p.read_text()
          start = s.index('    case "queue_track": {')
          end = s.index('    case "toggle_like": {', start)
          lines = ['    case "queue_track": {', '      if (model.queue.length >= MAX_QUEUE) return [model, Cmd.none];', '      const raw = msg.queueTrackId;']
          for i in range(1, 31):
              lines.append(f'      if (raw === {i}) {{')
              lines.append(f'        if (model.queue.find((item) => item.id === {i}) !== undefined) return [model, Cmd.none];')
              lines.append(f'        return [{{ ...model, queue: [...model.queue, {{ id: {i} }}] }}, Cmd.none];')
              lines.append('      }')
          lines.extend(['      return [model, Cmd.none];', '    }'])
          new_block = '\n'.join(lines) + '\n'
          p.write_text(s[:start] + new_block + s[end:])
          PY
      - name: Verify source
        run: sed -n '330,465p' src/core.ts
      - name: Commit source patch
        run: |
          git config user.name "spotify-ci"
          git config user.email "spotify-ci@users.noreply.github.com"
          git add src/core.ts
          git commit -m "fix: literalize native queue handles"
          git push origin HEAD:feat/native-octave-client
