name: Commit final ScriptC source fix

on:
  push:
    branches: ["feat/native-octave-client"]
    paths: [".github/workflows/final-core-fix.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-octave-client
      - name: Replace queue boundary with literal machine-integer cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core.ts')
          s = p.read_text()
          old = '''    case "queue_track": {
      const raw = msg.queueTrackId;
      if (!(raw >= 1 && raw <= 30)) return [model, Cmd.none];
      const id = Math.trunc(raw);
      if (model.queue.length >= MAX_QUEUE || model.queue.find((item) => item.id === id) !== undefined) return [model, Cmd.none];
      return [{ ...model, queue: [...model.queue, { id: id }] }, Cmd.none];
    }'''
          cases = []
          for i in range(1, 31):
              cases.append(f'''      if (raw === {i}) {{
        if (model.queue.find((item) => item.id === {i}) !== undefined) return [model, Cmd.none];
        return [{{ ...model, queue: [...model.queue, {{ id: {i} }}] }}, Cmd.none];
      }}''')
          new = '''    case "queue_track": {
      if (model.queue.length >= MAX_QUEUE) return [model, Cmd.none];
      const raw = msg.queueTrackId;
''' + '\n'.join(cases) + '''
      return [model, Cmd.none];
    }'''
          if old not in s:
              raise SystemExit('queue_track block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Verify queue source
        run: sed -n '330,475p' src/core.ts
      - name: Commit source patch
        run: |
          git config user.name "spotify-ci"
          git config user.email "spotify-ci@users.noreply.github.com"
          git add src/core.ts
          git commit -m "fix: literalize native queue handles"
          git push origin HEAD:feat/native-octave-client
