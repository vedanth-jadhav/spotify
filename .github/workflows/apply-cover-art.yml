name: Stage visual bindings

on:
  push:
    branches: ["feat/native-octave-client"]
    paths: [".github/workflows/apply-cover-art.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-octave-client
      - name: Add visual bindings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core.ts')
          s = p.read_text()
          anchor = 'export function hasNow(model: Model): boolean { return model.nowId !== 0; }\n'
          addition = anchor + 'export function hasCover(_model: Model): boolean { return false; }\nexport function coverImage(_model: Model): number { return 0; }\nexport function repeatActive(model: Model): boolean { return model.repeat !== "off"; }\n'
          if 'export function hasCover(' not in s:
              if anchor not in s:
                  raise SystemExit('hasNow binding anchor not found')
              s = s.replace(anchor, addition, 1)
          p.write_text(s)
          PY
      - name: Commit bindings
        shell: bash
        run: |
          git config user.name "spotify-ci"
          git config user.email "spotify-ci@users.noreply.github.com"
          git add src/core.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: expose visual shell bindings"
          git push origin HEAD:feat/native-octave-client
