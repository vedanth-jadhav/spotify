          PATCH
      - name: Commit core patch
        shell: bash
        run: |
          git config user.name "spotify-ci"
          git config user.email "spotify-ci@users.noreply.github.com"
          git add src/core.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: load Octave cover art in native player"
          git push origin HEAD:feat/native-octave-client
