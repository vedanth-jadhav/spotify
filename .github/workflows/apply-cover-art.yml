             | { readonly kind: "play_track"; readonly playTrackId: number }
             | { readonly kind: "toggle_play" }
             | { readonly kind: "next_track" }
          @@ -82,7 +90,7 @@
             | { readonly kind: "clock_tick"; readonly at: number };
           
           export const viewUnbound = [
          -  "search_fire", "octave_search_done", "octave_search_failed", "fallback_search_done", "fallback_search_failed", "resolve_track_done", "resolve_track_failed", "audio_event", "clock_tick",
          +  "search_fire", "octave_search_done", "octave_search_failed", "fallback_search_done", "fallback_search_failed", "resolve_track_done", "resolve_track_failed", "cover_done", "audio_event", "clock_tick",
           ] as const;
           
           const MAX_SEARCH = 96;
          @@ -131,6 +139,8 @@
               searchPhase: "idle",
               tracks: [],
               nowId: 0,
          +    coverImage: 0,
          +    coverRequestId: 0,
               queue: [],
               playing: false,
               buffering: false,
          @@ -210,6 +220,8 @@
             return {
               ...model,
               nowId: safeId,
          +    coverImage: model.coverRequestId === safeId ? model.coverImage : 0,
          +    coverRequestId: safeId,
               queue: dequeue(model, safeId),
               playing: true,
               buffering: false,
          @@ -290,20 +302,34 @@
                 if (track !== undefined && track.fallbackPreviewUrl.length > 0) return [{ ...model, fallbackPlayback: true }, Cmd.audioPlay("player", { url: track.fallbackPreviewUrl }, { event: "audio_event" })];
                 return [{ ...model, playing: false, loadPending: false, audioReady: false, errorText: msg.reason }, Cmd.none];
               }
          +    case "cover_done": {
          +      if (msg.id !== model.coverRequestId) {
          +        if (msg.state === "loaded" && msg.id > 0) return [model, Cmd.imageUnregister(msg.id)];
          +        return [model, Cmd.none];
          +      }
          +      if (msg.state === "loaded") return [{ ...model, coverImage: msg.id }, Cmd.none];
          +      return [{ ...model, coverImage: 0 }, Cmd.none];
          +    }
               case "play_track": {
                 const raw = msg.playTrackId;
                 if (!(raw >= 1 && raw <= 30)) return [model, Cmd.none];
                 const id = Math.trunc(raw);
                 const track = trackById(model, id);
                 if (track === undefined) return [model, Cmd.none];
          -      return [startTrack(model, id, track, false), Cmd.fetch({ url: octaveResolveUrl(track.remoteId), method: "GET", headers: { accept: "application/json" }, timeoutMs: 8000 }, { key: "play-resolve", ok: "resolve_track_done", err: "resolve_track_failed" })];
          +      const next = startTrack(model, id, track, false);
          +      if (track.coverUrl.length === 0 || (model.coverRequestId === id && model.coverImage === id)) return [next, Cmd.fetch({ url: octaveResolveUrl(track.remoteId), method: "GET", headers: { accept: "application/json" }, timeoutMs: 8000 }, { key: "play-resolve", ok: "resolve_track_done", err: "resolve_track_failed" })];
          +      if (model.coverRequestId > 0 && model.coverRequestId !== id) return [next, Cmd.batch([Cmd.imageCancel(model.coverRequestId), Cmd.imageUnregister(model.coverRequestId), Cmd.imageLoad(id, { url: track.coverUrl }, { event: "cover_done" }), Cmd.fetch({ url: octaveResolveUrl(track.remoteId), method: "GET", headers: { accept: "application/json" }, timeoutMs: 8000 }, { key: "play-resolve", ok: "resolve_track_done", err: "resolve_track_failed" })])];
          +      if (model.coverRequestId === id) return [next, Cmd.fetch({ url: octaveResolveUrl(track.remoteId), method: "GET", headers: { accept: "application/json" }, timeoutMs: 8000 }, { key: "play-resolve", ok: "resolve_track_done", err: "resolve_track_failed" })];
          +      return [next, Cmd.batch([Cmd.imageLoad(id, { url: track.coverUrl }, { event: "cover_done" }), Cmd.fetch({ url: octaveResolveUrl(track.remoteId), method: "GET", headers: { accept: "application/json" }, timeoutMs: 8000 }, { key: "play-resolve", ok: "resolve_track_done", err: "resolve_track_failed" })])];
               }
               case "toggle_play": {
                 if (model.nowId === 0) {
                   if (model.tracks.length === 0) return [model, Cmd.none];
                   const track = trackById(model, 1);
                   if (track === undefined) return [model, Cmd.none];
          -        return [startTrack(model, 1, track, false), Cmd.fetch({ url: octaveResolveUrl(track.remoteId), method: "GET", headers: { accept: "application/json" }, timeoutMs: 8000 }, { key: "play-resolve", ok: "resolve_track_done", err: "resolve_track_failed" })];
          +        const next = startTrack(model, 1, track, false);
          +        if (track.coverUrl.length === 0) return [next, Cmd.fetch({ url: octaveResolveUrl(track.remoteId), method: "GET", headers: { accept: "application/json" }, timeoutMs: 8000 }, { key: "play-resolve", ok: "resolve_track_done", err: "resolve_track_failed" })];
          +        return [next, Cmd.batch([Cmd.imageLoad(1, { url: track.coverUrl }, { event: "cover_done" }), Cmd.fetch({ url: octaveResolveUrl(track.remoteId), method: "GET", headers: { accept: "application/json" }, timeoutMs: 8000 }, { key: "play-resolve", ok: "resolve_track_done", err: "resolve_track_failed" })])];
                 }
                 if (model.loadPending) return [model, Cmd.none];
                 if (model.playing) return [{ ...model, playing: false }, Cmd.audioPause("player")];
          @@ -319,7 +345,11 @@
                 if (id === 0) return [{ ...model, playing: false, audioReady: false }, Cmd.audioStop("player")];
                 const track = trackById(model, id);
