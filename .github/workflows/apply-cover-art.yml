name: Apply full Spotify parity pass

on:
  push:
    branches: ["feat/native-octave-client"]
    paths: [".github/workflows/apply-cover-art.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-octave-client
          fetch-depth: 2
      - name: Apply completed product pass
        shell: bash
        run: |
          cat .github/parity.part.* | base64 --decode | gunzip > /tmp/full-parity.patch
          git apply --index /tmp/full-parity.patch
          git rm -f .github/parity.part.*
          git rm -f .github/workflows/apply-cover-art.yml || true
          git rm -f .github/workflows/apply-markup-fix.yml || true
          git rm -f .github/workflows/apply-native-arity-fix.yml || true
          git rm -f .github/workflows/final-core-fix.yml || true
          git rm -f .github/final-scriptc.patch || true
          git rm -f .github/native-integer.patch || true
      - name: Commit completed app
        shell: bash
        run: |
          git config user.name "spotify-ci"
          git config user.email "spotify-ci@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete Spotify parity product pass"
          git push origin HEAD:feat/native-octave-client
