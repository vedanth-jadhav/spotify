name: Apply parity fix

on:
  push:
    branches: ["feat/native-octave-client"]
    paths: [".github/workflows/apply-cover-art.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-octave-client
      - name: Fix native context menu attributes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app.native')
          s = p.read_text()
          s = s.replace('<menu-item icon="plus" on-press=', '<menu-item on-press=')
          s = s.replace('<menu-item icon="save" on-press=', '<menu-item on-press=')
          p.write_text(s)
          PY
      - name: Commit parity fix
        shell: bash
        run: |
          git config user.name "spotify-ci"
          git config user.email "spotify-ci@users.noreply.github.com"
          git add src/app.native
          git diff --cached --quiet && exit 0
          git commit -m "fix: use supported native context menu schema"
          git push origin HEAD:feat/native-octave-client
