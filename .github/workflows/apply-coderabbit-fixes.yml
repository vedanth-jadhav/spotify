name: Apply consolidated CodeRabbit fixes

on:
  push:
    branches: ["feat/native-octave-client"]
    paths:
      - ".github/coderabbit-fixes.patch.gz.b64"
      - ".github/workflows/apply-coderabbit-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-octave-client
      - name: Decode and verify reviewed fixes
        shell: bash
        run: |
          base64 -d .github/coderabbit-fixes.patch.gz.b64 | gunzip > /tmp/coderabbit-fixes.patch
          echo "e93aab2229f77ee7abc8f27ca1565afb148e07ce43d85f1676de8937700ddc16  /tmp/coderabbit-fixes.patch" | sha256sum -c -
          git apply /tmp/coderabbit-fixes.patch
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit review fixes
        shell: bash
        run: |
          rm .github/coderabbit-fixes.patch .github/coderabbit-fixes.patch.gz.b64 .github/workflows/apply-coderabbit-fixes.yml
          git config user.name "spotify-ci"
          git config user.email "spotify-ci@users.noreply.github.com"
          git add -A
          git commit -m "fix: address CodeRabbit review findings"
          git push origin HEAD:feat/native-octave-client
