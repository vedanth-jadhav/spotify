name: Apply consolidated CodeRabbit fixes

on:
  push:
    branches: ["feat/native-octave-client"]
    paths:
      - ".github/coderabbit-nonworkflow.patch.gz.b64"
      - ".github/workflows/apply-coderabbit-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-octave-client
      - name: Decode and verify source fixes
        shell: bash
        run: |
          base64 -d .github/coderabbit-nonworkflow.patch.gz.b64 | gunzip > /tmp/coderabbit-nonworkflow.patch
          echo "45099a8758975f70616d6dbdc7027a35634ad6ae7c90522b00ed1ddf025019bc  /tmp/coderabbit-nonworkflow.patch" | sha256sum -c -
          git apply /tmp/coderabbit-nonworkflow.patch
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit source and tests
        shell: bash
        run: |
          rm .github/coderabbit-nonworkflow.patch.gz.b64
          git config user.name "spotify-ci"
          git config user.email "spotify-ci@users.noreply.github.com"
          git add package.json package-lock.json src tests scripts .github/coderabbit-nonworkflow.patch.gz.b64
          git commit -m "fix: address CodeRabbit source findings"
          git push origin HEAD:feat/native-octave-client
