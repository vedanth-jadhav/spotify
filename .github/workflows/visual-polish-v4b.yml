name: Apply final Spotify density pass v4b

on:
  push:
    branches: [feat/spotify-ui-ux-final]
    paths: [.github/workflows/visual-polish-v4b.yml]

permissions:
  contents: write

jobs:
  polish:
    runs-on: macos-15
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spotify-ui-ux-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Apply density pass with bound image ids
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          w=Path('.github/workflows/visual-polish-v4.yml').read_text()
          script=dedent(w.split("python3 - <<'PY'\n",1)[1].split('\n          PY',1)[0])
          mapping={'17':'{artTrending}','14':'{artMix1}','15':'{artMix2}','16':'{artChill}','24':'{artPop}','25':'{artHiphop}'}
          for old,new in mapping.items():
              script=script.replace(f'image="{old}"', f'image="{new}"')
          exec(compile(script,'density-v4b.py','exec'))
          PY
      - run: npm ci
      - run: npx --no-install native check --yes
      - run: npm run test:unit
      - run: npx --no-install native test --yes
      - name: Commit final density pass
        run: |
          git config user.name spotify-ci
          git config user.email spotify-ci@users.noreply.github.com
          git add src/core.ts src/app.native
          git commit -m 'feat: refine Spotify density, artwork rows and search hierarchy'
          git push origin HEAD:feat/spotify-ui-ux-final
