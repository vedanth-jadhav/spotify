name: Recursive Spotify UI verifier

on:
  push:
    branches:
      - fix/spotify-ui-recursive
  workflow_dispatch:

concurrency:
  group: recursive-spotify-ui-verifier
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-and-capture:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/spotify-ui-recursive
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - name: Apply runtime-safe layout corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app.native')
          s = p.read_text()
          replacements = {
              'padding="0 8 8 8"': 'padding="8"',
              'padding="0 12 10 12"': 'padding="10"',
              'padding="8 14"': 'padding="10"',
              'padding="4 8 12 8"': 'padding="8"',
              'padding="20 24 26 24"': 'padding="24"',
              'padding="0 8"': 'padding="8"',
              'padding="20 24 30 24"': 'padding="24"',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - run: npm ci
      - name: Static validation
        run: npx --no-install native check --yes
      - name: Full tests
        run: npx --no-install native test --yes
      - name: Clean generated caches
        run: rm -rf .native/build .zig-cache zig-out
      - name: Build automation binary
        run: npx --no-install native build --yes -Dautomation=true
      - name: Use dark appearance
        shell: bash
        run: |
          defaults write -g AppleInterfaceStyle Dark
          killall cfprefsd || true
      - name: Launch, validate runtime, and capture
        shell: bash
        run: |
          ./zig-out/bin/spotify > /tmp/spotify-native.log 2>&1 &
          echo $! > /tmp/spotify-native.pid
          npx --no-install native automate wait
          npx --no-install native automate resize 1440 900 1
          sleep 1
          npx --no-install native automate snapshot | tee /tmp/spotify-snapshot.txt
          if grep -q "MarkupBuild" /tmp/spotify-snapshot.txt; then
            cat /tmp/spotify-native.log || true
            exit 1
          fi
          if grep -q "markup view failed to build" /tmp/spotify-native.log; then
            cat /tmp/spotify-native.log
            exit 1
          fi
          CAPTURE="$(npx --no-install native automate screenshot spotify-canvas 1 | tail -1)"
          test -s "$CAPTURE"
          mkdir -p docs/screenshots
          cp "$CAPTURE" docs/screenshots/home.png
      - name: Stop app
        if: always()
        shell: bash
        run: |
          if test -f /tmp/spotify-native.pid; then kill "$(cat /tmp/spotify-native.pid)" || true; fi
          if test -f /tmp/spotify-native.log; then tail -250 /tmp/spotify-native.log; fi
      - name: Commit verified source and screenshot
        shell: bash
        run: |
          git config user.name "spotify-ci"
          git config user.email "spotify-ci@users.noreply.github.com"
          git add src/app.native docs/screenshots/home.png
          git diff --cached --quiet && exit 0
          git commit -m "fix: render Spotify UI correctly at runtime"
          git push origin HEAD:fix/spotify-ui-recursive
