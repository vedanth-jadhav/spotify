name: Apply final binding collision fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-scriptc:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.16.0
      - run: npm ci
      - name: Inspect ScriptC compiler package
        shell: bash
        run: |
          set -euo pipefail
          echo '--- files ---'
          find node_modules/@scriptc node_modules/scriptc -type f -maxdepth 5 -print | sort
          echo '--- quota refs ---'
          grep -R -n -E 'EvalBranchQuota|eval.*branch|tag_name|field\.name|msg_tags|union disagree|core_shim' node_modules/@scriptc node_modules/scriptc | head -200 || true
