name: Apply final binding collision fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.16.0
      - name: Upgrade to current Native SDK
        run: npm install --save-dev --save-exact @native-sdk/cli@0.8.3
      - name: Commit toolchain refresh
        run: |
          set -euo pipefail
          git config user.name spotify-ci
          git config user.email spotify-ci@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m "fix: use current Native SDK compiled-core toolchain"
          git push
