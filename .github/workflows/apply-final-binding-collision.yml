name: Apply final binding collision fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rename numeric-leading quality enum members
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for root in ('src', 'tests'):
              for p in Path(root).glob('*.ts'):
                  s = p.read_text()
                  s = s.replace('"128"', '"q128"').replace('"320"', '"q320"')
                  if p.name == 'provider.ts':
                      s = s.replace('asciiBytes("q128")', 'asciiBytes("128")')
                      s = s.replace('asciiBytes("q320")', 'asciiBytes("320")')
                  p.write_text(s)
          PY
      - name: Commit quality enum fix
        run: |
          set -euo pipefail
          git config user.name spotify-ci
          git config user.email spotify-ci@users.noreply.github.com
          git add src tests
          git commit -m "fix: use declarable Native quality enum members"
          git push
