name: Apply final binding collision fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Disambiguate audio state for Native emitter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core.ts')
          s = p.read_text()
          old = '''    case "audio_event": {\n      switch (msg.state) {'''
          new = '''    case "audio_event": {\n      const audioState: AudioState = msg.state;\n      switch (audioState) {'''
          if old not in s:
              raise SystemExit('audio_event switch shape not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit audio state fix
        run: |
          set -euo pipefail
          git config user.name spotify-ci
          git config user.email spotify-ci@users.noreply.github.com
          git add src/core.ts
          git commit -m "fix: disambiguate Native audio event state"
          git push
