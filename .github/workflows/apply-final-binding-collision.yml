name: Apply final binding collision fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.16.0
      - run: npm ci
      - name: Build ReleaseFast native binary
        run: npx --no-install native build --yes
      - name: Package ad-hoc signed macOS app
        run: npx --no-install native package --target macos --signing adhoc
      - name: Verify packaged app signature
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find zig-out -type d -name '*.app' -print -quit)"
          test -n "$APP"
          codesign --verify --deep --strict "$APP"
          echo "Verified $APP"
