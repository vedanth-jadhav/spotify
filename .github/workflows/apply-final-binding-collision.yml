name: Apply final binding collision fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-native:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.16.0
      - run: npm ci
      - name: Locate Native SDK generated shim source
        shell: bash
        run: |
          set -euo pipefail
          grep -R -n -E 'msg_tags|core_shim|tag_name|EvalBranchQuota|std\.mem\.eql\(u8, field\.name' node_modules/@native-sdk | head -240 || true
