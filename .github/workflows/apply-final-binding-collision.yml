name: Apply final binding collision fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bind computed navigation result before object spread
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core.ts')
          s = p.read_text()
          old = '''    case "create_playlist": {\n      const next: Model = { ...navigate(model, "playlist"), playlistCreated: true };'''
          new = '''    case "create_playlist": {\n      const navigated = navigate(model, "playlist");\n      const next: Model = { ...navigated, playlistCreated: true };'''
          if old not in s:
              raise SystemExit('computed navigation spread not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit compatibility fix
        run: |
          set -euo pipefail
          git config user.name spotify-ci
          git config user.email spotify-ci@users.noreply.github.com
          git add src/core.ts
          git commit -m "fix: bind computed Native model spread"
          git push
