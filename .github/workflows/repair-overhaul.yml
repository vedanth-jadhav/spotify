name: Restore Spotify overhaul sources

on:
  push:
    branches: [feat/spotify-ui-ux-final]
    paths: [.github/workflows/repair-overhaul.yml]

permissions:
  contents: write

jobs:
  restore:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/spotify-ui-ux-final
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - name: Restore verified source snapshot
        run: |
          git checkout d1ca068b03b6bc9216c839f70646c79da41fa799 -- src/core.ts src/provider.ts src/app.native tests/core.test.ts tests/provider.test.ts scripts/smoke-octave.mjs
      - run: npm ci
      - run: npx --no-install native check --yes
      - run: npm run test:unit
      - name: Commit restored sources
        run: |
          git config user.name spotify-ci
          git config user.email spotify-ci@users.noreply.github.com
          git add src/core.ts src/provider.ts src/app.native tests/core.test.ts tests/provider.test.ts scripts/smoke-octave.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore verified Spotify overhaul sources'
          git push origin HEAD:feat/spotify-ui-ux-final
