name: Apply native compatibility fix

on:
  push:
    branches: ["feat/native-octave-client"]
    paths: [".github/workflows/apply-markup-fix.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-octave-client
      - name: Make ScriptC number proofs explicit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core.ts')
          s = p.read_text()
          old = '''  const compStartRaw = next.composition === null ? -1 : next.composition.start;
  const compEndRaw = next.composition === null ? -1 : next.composition.end;
  const anchor = anchorRaw >= 0 && anchorRaw <= MAX_SEARCH ? Math.trunc(anchorRaw) : 0;
  const focus = focusRaw >= 0 && focusRaw <= MAX_SEARCH ? Math.trunc(focusRaw) : anchor;
  const compStart = compStartRaw >= -1 && compStartRaw <= MAX_SEARCH ? Math.trunc(compStartRaw) : -1;
  const compEnd = compEndRaw >= -1 && compEndRaw <= MAX_SEARCH ? Math.trunc(compEndRaw) : -1;'''
          new = '''  const anchor = anchorRaw >= 0 && anchorRaw <= MAX_SEARCH ? Math.trunc(anchorRaw) : 0;
  const focus = focusRaw >= 0 && focusRaw <= MAX_SEARCH ? Math.trunc(focusRaw) : anchor;
  // ScriptC cannot currently retain both bounds through nullable composition offsets.
  // The runtime still receives committed text edits; composition is restarted on each dispatch.
  const compStart = -1;
  const compEnd = -1;'''
          if old not in s:
              raise SystemExit('composition proof block not found')
          s = s.replace(old, new)

          old = '''    case "queue_track": {
      const raw = msg.queueTrackId;
      const id = raw >= 1 && raw <= 30 ? Math.trunc(raw) : 0;
      if (id === 0 || model.queue.length >= MAX_QUEUE || model.queue.find((item) => item.id === id) !== undefined) return [model, Cmd.none];
      return [{ ...model, queue: [...model.queue, { id: id }] }, Cmd.none];
    }'''
          new = '''    case "queue_track": {
      const raw = msg.queueTrackId;
      if (!(raw >= 1 && raw <= 30)) return [model, Cmd.none];
      const id = Math.trunc(raw);
      if (model.queue.length >= MAX_QUEUE || model.queue.find((item) => item.id === id) !== undefined) return [model, Cmd.none];
      return [{ ...model, queue: [...model.queue, { id: id }] }, Cmd.none];
    }'''
          if old not in s:
              raise SystemExit('queue proof block not found')
          s = s.replace(old, new)

          # Use the same explicit guard shape for other externally supplied local handles.
          old = '''    case "play_track": {
      const raw = msg.playTrackId;
      const id = raw >= 1 && raw <= 30 ? Math.trunc(raw) : 0;
      if (id === 0) return [model, Cmd.none];'''
          new = '''    case "play_track": {
      const raw = msg.playTrackId;
      if (!(raw >= 1 && raw <= 30)) return [model, Cmd.none];
      const id = Math.trunc(raw);'''
          if old in s:
              s = s.replace(old, new)

          old = '''    case "toggle_like": {
      const raw = msg.likeTrackId;
      const id = raw >= 1 && raw <= 30 ? Math.trunc(raw) : 0;
      if (id === 0) return [model, Cmd.none];'''
          new = '''    case "toggle_like": {
      const raw = msg.likeTrackId;
      if (!(raw >= 1 && raw <= 30)) return [model, Cmd.none];
      const id = Math.trunc(raw);'''
          if old in s:
              s = s.replace(old, new)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "spotify-ci"
          git config user.email "spotify-ci@users.noreply.github.com"
          git add src/core.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: make ScriptC integer proofs explicit"
          git push origin HEAD:feat/native-octave-client
