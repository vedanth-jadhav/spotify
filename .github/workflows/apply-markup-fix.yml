name: Apply native compatibility fix

on:
  push:
    branches: ["feat/native-octave-client"]
    paths: [".github/workflows/apply-markup-fix.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-octave-client
      - name: Export model-reachable named records
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core.ts')
          s = p.read_text().replace('interface Draft {', 'export interface Draft {')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "spotify-ci"
          git config user.email "spotify-ci@users.noreply.github.com"
          git add src/core.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: export native model draft record"
          git push origin HEAD:feat/native-octave-client
