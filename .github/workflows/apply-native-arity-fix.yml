name: Apply Native SDK arity fix

on:
  push:
    branches: ["feat/native-octave-client"]
    paths: [".github/workflows/apply-native-arity-fix.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-octave-client
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Patch fixed-arity resolver and tests
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const providerPath = 'src/provider.ts';
          let p = fs.readFileSync(providerPath, 'utf8');
          const oldSig = 'export function octaveResolveUrl(remoteId: Bytes, quality: OctaveQuality = OCTAVE_DEFAULT_QUALITY): Bytes {';
          const replacement = 'export function octaveResolveUrl(remoteId: Bytes): Bytes {\n  return octaveResolveUrlWithQuality(remoteId, OCTAVE_DEFAULT_QUALITY);\n}\n\nexport function octaveResolveUrlWithQuality(remoteId: Bytes, quality: OctaveQuality): Bytes {';
          if (!p.includes(oldSig)) throw new Error('Expected resolver signature not found');
          p = p.replace(oldSig, replacement);
          fs.writeFileSync(providerPath, p);

          const testPath = 'tests/provider.test.ts';
          let t = fs.readFileSync(testPath, 'utf8');
          t = t.replace('octaveResolveUrl, octaveSearchUrl,', 'octaveResolveUrl, octaveResolveUrlWithQuality, octaveSearchUrl,');
          t = t.replace('octaveResolveUrl(b("136889400"), "128")', 'octaveResolveUrlWithQuality(b("136889400"), "128")');
          t = t.replace('octaveResolveUrl(b("136889400"), "lossless")', 'octaveResolveUrlWithQuality(b("136889400"), "lossless")');
          fs.writeFileSync(testPath, t);
          NODE
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "spotify-ci"
          git config user.email "spotify-ci@users.noreply.github.com"
          git add src/provider.ts tests/provider.test.ts
          git commit -m "fix: use fixed-arity Octave resolver functions"
          git push origin HEAD:feat/native-octave-client
