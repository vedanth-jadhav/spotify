name: Apply reviewed Spotify UX fixes v3

on:
  push:
    branches: [feat/spotify-ui-ux-final]
    paths: [.github/workflows/apply-review-fixes-v3.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/spotify-ui-ux-final
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - name: Apply reviewed fixes with structurally bounded caret
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          workflow = Path('.github/workflows/apply-review-fixes.yml').read_text()
          marker = "python3 - <<'PY'\n"
          script = dedent(workflow.split(marker, 1)[1].split('\n          PY', 1)[0])
          old = 'const caret = q.length <= MAX_SEARCH ? Math.trunc(q.length) : MAX_SEARCH;'
          new = '''let caret = 0;\n  for (let i = 0; i < MAX_SEARCH; i += 1) {\n    if (i < q.length) caret = i + 1;\n  }'''
          if old not in script:
            raise SystemExit('caret anchor missing')
          exec(compile(script.replace(old, new, 1), 'review-fixes.py', 'exec'))
          PY
      - run: npm ci
      - run: npx --no-install native check --yes
      - run: npm run test:unit
      - run: npx --no-install native test --yes
      - name: Commit reviewed fixes
        run: |
          git config user.name spotify-ci
          git config user.email spotify-ci@users.noreply.github.com
          git add src/core.ts src/provider.ts src/app.native tests/core.test.ts tests/provider.test.ts scripts/smoke-octave.mjs
          git commit -m 'fix: harden lyrics, artist flows and accessibility'
          git push origin HEAD:feat/spotify-ui-ux-final
