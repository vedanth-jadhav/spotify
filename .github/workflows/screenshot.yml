name: Capture native app screenshot

on:
  workflow_dispatch:
  push:
    branches: ["feat/native-octave-client"]
    paths: [".github/workflows/screenshot.yml"]

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-octave-client
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: npm install
      - name: Validate native sources
        run: npx native check --yes
      - name: Prove checked-out core and clear generated caches
        shell: bash
        run: |
          git rev-parse HEAD
          git hash-object src/core.ts
          sed -n '114,124p' src/core.ts
          sed -n '332,339p' src/core.ts
          rm -rf .native/build .zig-cache zig-out
      - name: Build with automation
        run: npx native build --yes -Dautomation=true
      - name: Launch and capture deterministic canvas
        shell: bash
        run: |
          ./zig-out/bin/spotify > /tmp/spotify-native.log 2>&1 &
          echo $! > /tmp/spotify-native.pid
          npx native automate wait
          npx native automate resize 1440 900 1
          npx native automate snapshot
          npx native automate screenshot spotify-canvas 1
          test -s screenshot-spotify-canvas.png
          mkdir -p docs/screenshots
          cp screenshot-spotify-canvas.png docs/screenshots/home.png
      - name: Stop app
        if: always()
        shell: bash
        run: |
          if test -f /tmp/spotify-native.pid; then kill "$(cat /tmp/spotify-native.pid)" || true; fi
          if test -f /tmp/spotify-native.log; then tail -200 /tmp/spotify-native.log; fi
      - name: Commit screenshot
        shell: bash
        run: |
          git config user.name "spotify-ci"
          git config user.email "spotify-ci@users.noreply.github.com"
          git add docs/screenshots/home.png
          git diff --cached --quiet && exit 0
          git commit -m "docs: capture built native app home screen"
          git push origin HEAD:feat/native-octave-client
