name: Octave deployed API probe

on:
  push:
    branches: ["feat/native-octave-client"]
    paths:
      - "scripts/discover-octave.mjs"
      - ".github/workflows/octave-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Discover API strings from deployed Octave bundles
        run: node scripts/discover-octave.mjs
