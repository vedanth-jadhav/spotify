name: Apply final native numeric fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-octave-client
      - name: Apply atomic source fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/provider.ts')
          s = p.read_text()
          old = '''function decimalBytes(value: number): Bytes {
            if (!(value >= 0) || value > 9007199254740991) return asciiBytes("0");
            let n = Math.trunc(value);
            if (n === 0) return asciiBytes("0");
            const reversed = new Uint8Array(16);
            let count = 0;
            while (n > 0 && count < reversed.length) {
              reversed[count] = 0x30 + (n % 10);
              n = Math.trunc(n / 10);
              count += 1;
            }
            const out = new Uint8Array(count);
            for (let i = 0; i < count; i += 1) out[i] = reversed[count - i - 1];
            return out;
          }
          '''
          new = '''function decimalBytes(value: number): Bytes {
            let rest = value >= 0 && value <= 9999 ? Math.trunc(value) : 0;
            const out = new Uint8Array(4);
            let size = 0;
            let thousands = 0;
            while (rest >= 1000) { rest -= 1000; thousands += 1; }
            let hundreds = 0;
            while (rest >= 100) { rest -= 100; hundreds += 1; }
            let tens = 0;
            while (rest >= 10) { rest -= 10; tens += 1; }
            if (thousands > 0) { out[size] = 0x30 + thousands; size += 1; }
            if (size > 0 || hundreds > 0) { out[size] = 0x30 + hundreds; size += 1; }
            if (size > 0 || tens > 0) { out[size] = 0x30 + tens; size += 1; }
            out[size] = 0x30 + rest;
            size += 1;
            return out.slice(0, size);
          }
          '''
          assert old in s
          s = s.replace(old, new)

          old = '''function idBefore(bytes: Bytes, before: number): number {
            const key = asciiBytes("\\\"id\\\":");
            const start = Math.max(0, before - 180);
            let found = -1;
            let cursor = start;
            while (cursor < before) {
              const next = findFrom(bytes, key, cursor);
              if (next < 0 || next >= before) break;
              found = next;
              cursor = next + key.length;
            }
            return found < 0 ? 0 : parseUnsignedAt(bytes, found + key.length);
          }
          '''
          new = '''function unsignedBytesAt(bytes: Bytes, at: number): Bytes {
            let start = at;
            while (start < bytes.length && (bytes[start] === 0x20 || bytes[start] === 0x3a)) start += 1;
            let end = start;
            while (end < bytes.length && bytes[end] >= 0x30 && bytes[end] <= 0x39) end += 1;
            return end > start ? bytes.slice(start, end) : new Uint8Array(0);
          }

          function idBefore(bytes: Bytes, before: number): Bytes {
            const key = asciiBytes("\\\"id\\\":");
            const start = Math.max(0, before - 180);
            let found = -1;
            let cursor = start;
            while (cursor < before) {
              const next = findFrom(bytes, key, cursor);
              if (next < 0 || next >= before) break;
              found = next;
              cursor = next + key.length;
            }
            return found < 0 ? new Uint8Array(0) : unsignedBytesAt(bytes, found + key.length);
          }
          '''
          assert old in s
          s = s.replace(old, new)
          s = s.replace('    const id = idBefore(body, titleAt);', '    const remoteId = idBefore(body, titleAt);')
          s = s.replace('''    if (id > 0 && title.length > 0) {
              out.push({ remoteId: decimalBytes(id), title: title, artist: artist, album: album, durationSec: duration, coverUrl: cover, fallbackPreviewUrl: preview });
            }''', '''    if (remoteId.length > 0 && title.length > 0) {
              out.push({ remoteId: remoteId, title: title, artist: artist, album: album, durationSec: duration, coverUrl: cover, fallbackPreviewUrl: preview });
            }''')
          old = '''export function formatSeconds(value: number): Bytes {
            const total = value >= 0 && value < 86400 ? Math.trunc(value) : 0;
            const minutes = Math.trunc(total / 60);
            const seconds = total % 60;
            const left = decimalBytes(minutes);
            const right = seconds < 10 ? concatBytes(asciiBytes("0"), decimalBytes(seconds)) : decimalBytes(seconds);
            return concat3(left, asciiBytes(":"), right);
          }
          '''
          new = '''export function formatSeconds(value: number): Bytes {
            let seconds = value >= 0 && value < 86400 ? Math.trunc(value) : 0;
            let minutes = 0;
            while (seconds >= 60) { seconds -= 60; minutes += 1; }
            const left = decimalBytes(minutes);
            const right = seconds < 10 ? concatBytes(asciiBytes("0"), decimalBytes(seconds)) : decimalBytes(seconds);
            return concat3(left, asciiBytes(":"), right);
          }
          '''
          assert old in s
          p.write_text(s.replace(old, new))

          p = Path('src/core.ts')
          s = p.read_text()
          old = '''export function positionLabel(model: Model): Bytes { return formatSeconds(Math.trunc(model.positionMs / 1000)); }
          export function durationLabel(model: Model): Bytes { return formatSeconds(Math.trunc(model.durationMs / 1000)); }
          export function seekFraction(model: Model): number { return model.durationMs > 0 ? model.positionMs / model.durationMs : 0; }
          export function volumeFraction(model: Model): number { return model.volumePermille / 1000; }
          '''
          new = '''function formatMilliseconds(value: number): Bytes {
            let rest = value >= 0 && value <= 86400000 ? Math.trunc(value) : 0;
            let minutes = 0;
            while (rest >= 60000) { rest -= 60000; minutes += 1; }
            let seconds = 0;
            while (rest >= 1000) { rest -= 1000; seconds += 1; }
            return formatSeconds(minutes * 60 + seconds);
          }

          export function positionLabel(model: Model): Bytes { return formatMilliseconds(model.positionMs); }
          export function durationLabel(model: Model): Bytes { return formatMilliseconds(model.durationMs); }
          export function seekFraction(model: Model): number {
            if (model.durationMs <= 0) return 0;
            const scaledPosition = model.positionMs * 1000;
            let steps = 0;
            while (steps < 1000 && model.durationMs * (steps + 1) <= scaledPosition) steps += 1;
            if (steps === 0) return 0;
            let fraction = 0.001;
            let i = 1;
            while (i < steps) { fraction += 0.001; i += 1; }
            return fraction;
          }
          export function volumeFraction(model: Model): number {
            if (model.volumePermille <= 0) return 0;
            let fraction = 0.001;
            let i = 1;
            while (i < model.volumePermille && i < 1000) { fraction += 0.001; i += 1; }
            return fraction;
          }
          '''
          assert old in s
          p.write_text(s.replace(old, new))
          PY

          rm .github/workflows/apply-final-native-type-fix.yml
          git config user.name "spotify-ci"
          git config user.email "spotify-ci@users.noreply.github.com"
          git add src/core.ts src/provider.ts .github/workflows/apply-final-native-type-fix.yml
          git commit -m "fix: isolate native integer and fractional numeric paths"
          git push origin HEAD:feat/native-octave-client
