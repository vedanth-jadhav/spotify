name: Apply final native numeric fix

on:
  push:
    branches: ["feat/native-octave-client"]
    paths:
      - ".github/final-native-type.patch"
      - ".github/workflows/apply-final-native-type-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-octave-client
      - name: Apply source patch
        run: git apply .github/final-native-type.patch
      - name: Commit final source
        shell: bash
        run: |
          rm .github/final-native-type.patch .github/workflows/apply-final-native-type-fix.yml
          git config user.name "spotify-ci"
          git config user.email "spotify-ci@users.noreply.github.com"
          git add src/core.ts src/provider.ts .github/final-native-type.patch .github/workflows/apply-final-native-type-fix.yml
          git commit -m "fix: isolate native integer and fractional numeric paths"
          git push origin HEAD:feat/native-octave-client
